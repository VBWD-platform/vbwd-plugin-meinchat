name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI — meinchat
    runs-on: ubuntu-latest

    steps:
      - name: Clone vbwd-backend
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-backend
          ref: main
          path: vbwd-backend

      - name: Clone plugin
        uses: actions/checkout@v4
        with:
          path: vbwd-backend/plugins/meinchat

      # meinchat declares dependencies=["subscription"]; its migration branch
      # anchors on subscription's sub_baseline, so clone subscription (real) +
      # email (subscription's own dependency).
      - name: Clone subscription dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-subscription
          path: vbwd-backend/plugins/subscription

      - name: Clone email dependency
        uses: actions/checkout@v4
        with:
          repository: VBWD-platform/vbwd-plugin-email
          path: vbwd-backend/plugins/email

      - name: Pre-create empty migration dirs for sibling plugins
        # alembic.ini ships with `version_locations` for every plugin's
        # migrations dir. In this CI only meinchat is overlaid, so the
        # other plugin dirs don't exist on disk — and alembic refuses to
        # start with a missing version_location, which silently kills the
        # api container's `alembic upgrade heads` and leaves the DB empty.
        # Empty dirs are enough: alembic finds no revisions there but
        # also doesn't error.
        run: |
          for plugin_dir in taro cms ghrm booking chat shop discount; do
            mkdir -p "vbwd-backend/plugins/${plugin_dir}/migrations/versions"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: vbwd-backend/requirements.txt

      - run: pip install -r vbwd-backend/requirements.txt

      - name: Start services
        working-directory: vbwd-backend
        run: docker compose up -d --build

      - name: Wait for API
        working-directory: vbwd-backend
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/v1/health > /dev/null 2>&1 && break; sleep 2; done

      - name: Run pre-commit (lint + unit)
        working-directory: vbwd-backend
        run: docker compose run --rm test ./bin/pre-commit-check.sh --plugin meinchat --quick

      - name: Run integration tests
        if: always()
        working-directory: vbwd-backend
        run: |
          integration_dir="plugins/meinchat/tests/integration"
          if [ ! -d "$integration_dir" ]; then
            echo "No integration tests yet — skipping"
            exit 0
          fi
          # The api container's CMD runs `alembic upgrade heads` after the
          # entrypoint starts, but `docker compose up -d --build` returns
          # immediately. Without this guard the integration tests race the
          # migration and explode on `relation "vbwd_user" does not exist`.
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres psql -U vbwd -d vbwd \
                -c "SELECT 1 FROM vbwd_user LIMIT 1" > /dev/null 2>&1; then
              echo "vbwd_user table is ready (attempt $attempt)"
              break
            fi
            sleep 2
          done
          # --no-deps prevents test-integration from recreating the api
          # container (which would force another alembic round-trip and
          # re-introduce the race we just waited out).
          docker compose --profile test-integration run --rm --no-deps test-integration \
            bash -c "pytest plugins/meinchat/tests/integration/ -v --tb=short"

      - name: Cleanup
        if: always()
        working-directory: vbwd-backend
        run: docker compose down -v
